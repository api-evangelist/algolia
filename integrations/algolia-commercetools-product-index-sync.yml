arazzo: 1.0.1
info:
  title: Algolia commercetools product index sync
  summary: Index a commercetools product as an Algolia record
  description: Index a commercetools product as an Algolia record Reads the product from commercetools and upserts it as a record in an Algolia index keyed by the product id (partialUpdateObject with createIfNotExists).
    Recreated from the integration Algolia documents on its own docs host, linked in x-integration.
  version: 1.0.0
sourceDescriptions:
- name: commercetoolsProducts
  url: https://raw.githubusercontent.com/api-evangelist/commercetools/refs/heads/main/openapi/commercetools-products-api-openapi.yml
  type: openapi
- name: algoliaSearch
  url: https://raw.githubusercontent.com/api-evangelist/algolia/refs/heads/main/openapi/algolia-search-api-openapi.yml
  type: openapi
workflows:
- workflowId: commercetools-product-index-sync
  summary: Index a commercetools product as an Algolia record
  description: Index a commercetools product as an Algolia record.
  inputs:
    type: object
    properties:
      projectKey:
        type: string
      productId:
        type: string
      indexName:
        type: string
        description: Algolia index that holds the product records
  steps:
  - stepId: get-product
    description: Read the product from commercetools.
    operationId: $sourceDescriptions.commercetoolsProducts.getProductById
    parameters:
    - name: projectKey
      in: path
      value: $inputs.projectKey
    - name: id
      in: path
      value: $inputs.productId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      productId: $response.body#/id
      key: $response.body#/key
      name: $response.body#/masterData/current/name
  - stepId: upsert-record
    description: Upsert the product as an Algolia record, creating it when absent.
    operationId: $sourceDescriptions.algoliaSearch.partialUpdateObject
    parameters:
    - name: indexName
      in: path
      value: $inputs.indexName
    - name: objectID
      in: path
      value: $steps.get-product.outputs.productId
    - name: createIfNotExists
      in: query
      value: true
    requestBody:
      contentType: application/json
      payload:
        key: $steps.get-product.outputs.key
        name: $steps.get-product.outputs.name
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      taskID: $response.body#/taskID
  outputs:
    taskID: $steps.upsert-record.outputs.taskID
x-integration:
  partner: commercetools
  edge_evidence: https://www.algolia.com/doc/integration/commercetools/get-started/
  edge_type: claimed
  method: generated
  generated: '2026-10-12'
  generator: claude-opus-5-5 enrichment local-v5
  guessed_steps:
