versioning:
  scheme: url-path
  current: /1/
  quote: The current version of the Search API is version 1, indicated by the /1/ in each endpoint's URL.
  note: 'Version lives in the path, not in a header or a media type. Per-product exceptions: A/B Testing runs /2/ (deprecated)
    and /3/ side by side, and Analytics added v3 pattern endpoints in the 2026-08-18 release while keeping the v2 surface.'
deprecation:
  published_policy_page: null
  mechanism: in-contract
  note: Algolia does not publish a standalone deprecation-policy page. What it does instead is mark operations deprecated:true
    IN the OpenAPI documents it generates its clients from, so the signal reaches every SDK and every consumer of the spec.
    That is a stronger machine signal than a prose policy page, and it is why this artifact can enumerate 25 deprecated operations
    by operationId. What is MISSING is a stated sunset date or removal window for any of them.
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  rfc8594_note: No Sunset or Deprecation response header is declared in any of the 15 OpenAPI documents, and none was observed
    on a live response.
deprecated_operations_summary:
  count: 25
  source: 'deprecated: true flags read from the first-party OpenAPI documents in openapi/'
  clusters:
  - name: A/B Testing v2
    spec: algolia-abtesting-api-openapi.yml
    count: 6
    successor: openapi/algolia-abtesting-v3-api-openapi.yml (A/B Testing API 3.0.0, 12 operations, none deprecated)
    note: The entire v2 A/B Testing surface is deprecated in favour of v3.
  - name: Ingestion Tasks V1
    spec: algolia-ingestion-api-openapi.yml
    count: 9
    successor: The non-V1 task operations in the same document (listTasks, createTask, getTask, updateTask, runTask, enableTask,
      disableTask).
    note: A within-document v1 to v2 migration - the deprecated operations are suffixed V1 and sit alongside their replacements.
  - name: Search cluster / user-ID mapping
    spec: algolia-search-api-openapi.yml
    count: 9
    successor: null
    note: The multi-cluster user-ID mapping surface (/1/clusters/*) is deprecated with no in-spec successor. This is the MCM
      feature, which is Enterprise-only.
  - name: Advanced Personalization realtime compute
    spec: algolia-advanced-personalization-api-openapi.yml
    count: 1
    successor: null
