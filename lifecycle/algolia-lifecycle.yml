breaking_change_practice:
  note: Algolia flags breaking changes explicitly in its per-language client changelogs, with a note describing the migration.
    Two examples from the recent window.
  examples:
  - version: 5.55.2
    date: 2026-07
    change: BREAKING CHANGE - removed recommend query params overridden by the API (ranking, facetFilters, enableABTest, and
      enableRules from fallbackParameters).
    impact: API behaviour unchanged; code setting these fields must be updated.
  - version: 5.55.1
    date: 2026-07
    change: BREAKING CHANGE - allow null records in getObjects response.
    impact: The response type widened to a list of nullable objects.
  migration_tooling: Algolia ships an Agent Skill, algolia-migration, that migrates API client code to the latest major version
    across JS, Python, Go, PHP, Java, C#, Ruby, Kotlin, Scala and Swift (skills/_provider/algolia-migration.md).
sla:
  published: true
  url: https://www.algolia.com/policies/sla/
  http_status: 200
  headline: 99.999% uptime SLA
  headline_source: https://www.algolia.com/llms.txt
  note: The SLA is a policy document, gated to committed subscribers for the specific commitments.
status_page:
  url: https://status.algolia.com
  http_status: 200
  type: first-party
  note: 'Algolia runs its own status page rather than a third-party one, and exposes it as an API - the Monitoring API (openapi/algolia-monitoring-api-openapi.yml,
    14 operations) serves server status, latency, indexing and reachability metrics for a specific application from the same
    host. That is materially more than a status page: an agent can query the health of ITS OWN cluster, not just the global
    service.'
  api: openapi/algolia-monitoring-api-openapi.yml
support:
  url: https://support.algolia.com/hc/en-us
  http_status: 403
  note: 403 to an automated fetch (Cloudflare bot challenge); the help centre is publicly reachable in a browser and is linked
    from Algolia docs throughout.
release_cadence:
  note: Every first-party API client is generated from the specs in github.com/algolia/api-clients-automation and released
    on one train. Nine of the ten clients last published on 2026-08-18.
  detail: packages/algolia-packages.yml
  changelog: changelog/algolia-changelog.yml
