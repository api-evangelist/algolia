- name: Algolia Recommend API
  description: Returns related-products, frequently-bought-together, trending and look-alike recommendations trained from Insights events and
    catalog data, plus the Recommend rules that override them.
  humanURL: https://www.algolia.com/doc/rest-api/recommend/
  baseURL: https://{appid}-dsn.algolia.net
