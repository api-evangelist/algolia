apis:
- name: Algolia Search API
  description: Core indexing and search API for adding, updating and deleting records and querying them with typo-tolerant, faceted, geo-aware
    and rule-driven search served from globally distributed search nodes. The largest surface in the estate at 78 operations, and the one carrying
    the retry strategy, asynchronous-task and API-key ACL semantics the rest of the platform inherits.
  humanURL: https://www.algolia.com/doc/rest-api/search/
  baseURL: https://{appid}-dsn.algolia.net
  tags:
  - Search
  - Indexing
  - REST
  properties:
  - type: Documentation
    url: https://www.algolia.com/doc/rest-api/search/
  - type: APIReference
