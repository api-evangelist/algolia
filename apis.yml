name: Algolia
description: Algolia is a hosted search and discovery platform that delivers fast, typo-tolerant search, browse, recommendations and personalization
  through a suite of REST APIs and edge-distributed infrastructure. It powers search experiences for ecommerce, media, SaaS and content sites,
  pairing a synchronous indexing and query control plane with event-driven Insights, Recommend, A/B Testing and Personalization products. Algolia
  generates every first-party API client and its reference documentation from 15 public OpenAPI documents totalling 342 operations, and has extended
  the platform into the agent layer with two managed MCP servers, an Agent Studio runtime and 18 self-published Agent Skills.
