  - type: OpenAPI
    url: openapi/algolia-search-api-openapi.yml
  - type: OpenAPI
    url: openapi/algolia-algoliasearch-api-openapi.yml
  - type: Overlay
    url: overlays/algolia-search-api-overlay.yaml
- name: Algolia Insights API
  description: Inbound event-ingestion API for click, conversion, view and purchase signals that feed Personalization, Recommend, A/B Testing
    and Analytics. Accepts events; does not emit them, which is why Algolia publishes no AsyncAPI or webhook contract.
  humanURL: https://www.algolia.com/doc/rest-api/insights/
  baseURL: https://insights.algolia.io
  tags:
