specification: API Commons Data Model
specificationVersion: '0.1'
provider: Algolia
providerId: algolia
generated: '2026-08-27'
method: derived
source: Derived from the components.schemas $ref graph and id-reference fields across the 15 first-party Algolia OpenAPI documents
  in openapi/.
shape_note: 'Algolia is unusual in that its PRIMARY entity - the record - has NO schema. Records are free-form caller-supplied
  JSON, so the $ref graph below describes the CONTROL PLANE (indices, settings, rules, tasks, connectors, experiments), not
  the searched data. An agent modelling Algolia has to hold both: a rich, fully specified configuration model and a completely
  open data model.'
root_entities:
- name: Application
  identifier: appId
  scope: servers[] variable
  description: The top-level Algolia tenant, addressed as a server variable rather than a schema. Owns indices, API keys,
    analytics, connectors, and MCP server instances. This is why almost every Algolia base URL is templated.
- name: Index
  identifier: indexName
  description: A searchable dataset of records plus its settings, replicas, rules and synonyms. Path parameter on most Search,
    Recommend, Query Suggestions and Analytics operations.
- name: Record
  identifier: objectID
  description: 'A single searchable JSON object. Free-form: no schema, max 10-100 KB by plan, objectID max 200 characters.
    addObject mints an objectID; saveObject requires one.'
- name: Task
  identifier: taskID
  description: Every write enqueues a job and returns a taskID. The write is not visible until the task completes.
identifier_conventions:
- field: objectID
  entity: Record
  note: Caller-supplied or Algolia-minted. Whether it is supplied is what makes a write idempotent - see conventions/algolia-conventions.yml.
- field: indexName
  entity: Index
  note: Path parameter, not an opaque ID - the human-readable name IS the key.
- field: taskID
  entity: Task
  note: Poll with waitTask/getTask before reading back.
- field: queryID
  entity: Query
  note: Returned by search when clickAnalytics is enabled; the join key between a search and the Insights events attributed
    to it.
- field: userToken
  entity: User
  note: Caller-supplied pseudonymous identifier linking Insights events to Personalization affinity profiles. The only cross-product
    identity in the estate.
cross_product_joins:
- from: Search (queryID)
  to: Insights (queryID)
  note: Attributes a click or conversion to the search that produced it.
- from: Insights (userToken)
  to: Personalization / Advanced Personalization
  note: Builds the affinity profile that re-ranks results.
- from: Insights events
  to: Recommend models
  note: Trains bought-together, related-products, trending and looking-similar.
- from: Insights events
  to: A/B Testing
  note: Scores variants on click-through and conversion.
