description: Algolia generates every first-party API client from the OpenAPI documents in github.com/algolia/api-clients-automation, and releases
  them on one train - the JavaScript, Python, PHP, Ruby, Go, Java, Kotlin, C# and Swift clients all published on 2026-08-18 from the same generation
  run. The version numbers differ per language because each client carries its own major line, but the release DATES move together. Versions and
  dates below were read from each registry's metadata endpoint on 2026-08-27.
currency_note: 'The API clients are current. The decay is concentrated in the older UI and framework integrations: angular-instantsearch last
  shipped 2024-09-05, search-insights 2024-11-18, algoliasearch-rails 2025-03-28, and the Maven-hosted Scala client 2026-06-23. The legacy Java
  v3 artifacts (com.algolia:algoliasearch-core and friends) stopped at 3.16.10 on 2024-10-29 and are superseded by com.algolia:algoliasearch v4.'
