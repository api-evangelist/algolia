specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Algolia
providerId: algolia
name: Algolia Pricing
created: '2026-05-04'
modified: '2026-09-23'
generated: '2026-09-23'
method: searched
source: https://www.algolia.com/pricing/
sources:
  - https://www.algolia.com/pricing/
  - https://www.algolia.com/doc/guides/scaling/algolia-service-limits
supersedes: >-
  The 2026-05-04 bulk-sweep version of this file, which was method:generated and listed a Build/Grow/Grow Plus/
  Elevate ladder with 1M records and 10K searches on the free tier. Algolia has since renamed the entry tier to
  Free and restated its allowances. Figures below were read from the live pricing page on 2026-09-23.
tags:
  - Search
  - Discovery
description: >-
  Four tiers. Three are self-serve and usage-priced; the fourth is annual-contract, contact-sales. The pricing
  meter is two-dimensional - search REQUESTS and RECORDS are metered and billed separately, and the overage rate
  on search requests is what separates Grow from Grow Plus.
audience: business-product
pricing_basis: usage-other
published: true
delivery:
  delivery: managed
  evidence: >-
    Algolia's plans are all delivered as a managed hosted search service; there is no self-hosted or
    community edition on the pricing page.
billing_model: usage-based
metered_dimensions:
  - name: search requests
    unit: 1,000 requests
  - name: records
    unit: 1,000 records
plan_count: 4
plans:
  - id: algolia-free
    name: Free
    type: freemium
    price: 0
    price_text: Build for free
    currency: USD
    timeFrame: month
    contract_required: false
    description: 'Get started building your best search experiences ever with access to some of our features to start for free.'
    features:
      - 10K search requests/month
      - 50K records included
      - 5K recommendation requests/month
      - 5K crawls/month
      - No credit card required.
    limits:
      - name: search_requests
        limit_text: 10K search requests/month
        window: month
        max: 10000
        scope: application
      - name: records
        limit_text: 50K records included
        max: 50000
        scope: application
      - name: recommendation_requests
        limit_text: 5K recommendation requests/month
        window: month
        max: 5000
        scope: application
      - name: crawls
        limit_text: 5K crawls/month
        window: month
        max: 5000
        scope: application
      - name: application_size
        limit_text: 1 GB (Free plan cap on applicationSize per service-limits page)
        max: 1
        unit: GB
        scope: application
      - name: indices_per_application
        limit_text: 10 (Free plan cap on indicesPerApplication per service-limits page)
        max: 10
        scope: application
      - name: record_size
        limit_text: 10 KB maximum for the Free plan
        max: 10
        unit: KB
        scope: record
      - name: synonyms_per_index
        limit_text: 1,000 for the Free plan
        max: 1000
        scope: index
  - id: algolia-grow
    name: Grow
    type: pay-as-you-go
    price: 'Start for free'
    price_text: Start for free
    currency: USD
    timeFrame: month
    contract_required: false
    description: 'Keyword search - Pay as you go, monthly billing, no contract required.'
    features:
      - Keyword Search + Browse
      - Query suggestions
      - 'Rules: 10/index'
      - Manual synonyms
      - Data transformation
      - 30 days analytics retention
      - Third party integrations + connectors
      - 'US, UK, EU hosting locations'
    limits:
      - name: search_requests_included
        limit_text: 10K search requests /month included then $0.50 per additional 1K search requests
        window: month
        max: 10000
        overage_price: '0.50'
        overage_unit: 1000
        currency: USD
        scope: application
      - name: records_included
        limit_text: 100K records included then $0.40 per additional 1K records
        max: 100000
        overage_price: '0.40'
        overage_unit: 1000
        currency: USD
        scope: application
      - name: indices_per_application
        limit_text: 50 indices per application on Grow (Free is 10; Premium is 1,000)
        max: 50
        scope: application
  - id: algolia-grow-plus
    name: Grow Plus
    type: pay-as-you-go
    price: 'Start for free'
    price_text: Start for free
    currency: USD
    timeFrame: month
    contract_required: false
    badge: NEW
    description: >-
      Keyword search with AI capabilities. Same included allowances as Grow, with a search-request overage rate
      3.5x higher ($1.75 vs $0.50 per 1K).
    features:
      - EVERYTHING IN GROW, PLUS
      - 'Rules: 10,000/index'
      - AI Synonyms
      - AI Ranking
      - Advanced Personalization
      - Query Categorization
      - Collections
      - 90 days analytics retention
    limits:
      - name: search_requests_included
        limit_text: 10K search requests /month included then $1.75 per additional 1K search requests
        window: month
        max: 10000
        overage_price: '1.75'
        overage_unit: 1000
        currency: USD
        scope: application
      - name: records_included
        limit_text: 100K records included then $0.40 per additional 1K records
        max: 100000
        overage_price: '0.40'
        overage_unit: 1000
        currency: USD
        scope: application
  - id: algolia-elevate
    name: Elevate
    type: enterprise
    price: 'Request pricing'
    price_text: Request pricing
    currency: USD
    contract_required: true
    contract_term: annual
    description: 'Enterprise-scale AI Search - Custom search requests and records; annual contract required. Volume-based discounts.'
    features:
      - NeuralSearch
      - AI Collections
      - Smart Groups
      - Real-time personalization
      - 99.99% availability
      - Access to SSO and enhanced SLA
      - Volume-based discounts
    limits:
      - name: search_requests
        limit_text: Custom search requests and records
        scope: application
      - name: records
        limit_text: Custom search requests and records
        scope: application
add_ons:
  - name: Enterprise add-on
    url: https://dashboard.algolia.com/info/plans/
    includes: [SAML SSO, AES256 encryption via Algolia Vault, index restoration assistance, multi-cluster user-ID mapping]
    note: >-
      Referenced from the security and delete-indices documentation rather than priced on the pricing page.
free_products:
  - name: DocSearch
    url: https://docsearch.algolia.com/
    price: 0
    price_text: Free hosted documentation search
    note: >-
      Free hosted documentation search with its own limits - 25 GB application/index size, 20 indices, 3 queries
      per second, 10 team members. Separate from the plan ladder above.
mcp_pricing:
  note: 'Algolia states MCP usage counts toward the existing plan and carries no separate fee.'
  source: https://www.algolia.com/doc/guides/model-context-protocol
