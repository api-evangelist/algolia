specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Algolia
providerId: algolia
created: '2026-05-04'
modified: '2026-08-27'
generated: '2026-08-27'
method: searched
source: https://www.algolia.com/pricing/
sources:
  - https://www.algolia.com/pricing/
  - https://www.algolia.com/doc/guides/scaling/algolia-service-limits
supersedes: >-
  The 2026-05-04 bulk-sweep version of this file, which was method:generated and listed a Build/Grow/Grow Plus/
  Elevate ladder with 1M records and 10K searches on the free tier. Algolia has since renamed the entry tier to
  Free and restated its allowances. Figures below were read from the live pricing page on 2026-08-27.
tags:
  - Search
  - Discovery
description: >-
  Four tiers. Three are self-serve and usage-priced; the fourth is annual-contract, contact-sales. The pricing
  meter is two-dimensional - search REQUESTS and RECORDS are metered and billed separately, and the overage rate
  on search requests is what separates Grow from Grow Plus.
billing_model: usage-based
metered_dimensions:
  - name: search requests
    unit: 1,000 requests
  - name: records
    unit: 1,000 records
plan_count: 4
plans:
  - id: algolia-free
    name: Free
    type: freemium
    price: '0.00'
    currency: USD
    timeFrame: month
    contract_required: false
    description: 'Free tier, no credit card required.'
    entries:
      - label: Search requests
        name: search_requests
        type: quota
        metric: search_request
        limit: 10000
        timeFrame: month
        unit: 1
        price: '0.00'
        quote: '10K search requests/month'
      - label: Records
        name: records
        type: quota
        metric: record
        limit: 50000
        timeFrame: month
        unit: 1
        price: '0.00'
        quote: '50K records included'
    limits:
      application_size: 1 GB
      index_size: 1 GB
      indices_per_application: 10
      record_size: 10 KB
      synonyms_per_index: 1000
  - id: algolia-grow
    name: Grow
    type: pay-as-you-go
    price: null
    price_note: No base price published; billed on usage above the included allowances.
    currency: USD
    timeFrame: month
    contract_required: false
    description: 'Pay-as-you-go, monthly billing, no contract required.'
    entries:
      - label: Search requests
        name: search_requests
        type: quota
        metric: search_request
        limit: 10000
        timeFrame: month
        overage_price: '0.50'
        overage_unit: 1000
        currency: USD
        quote: '10K search requests /month included then $0.50 per additional 1K'
      - label: Records
        name: records
        type: quota
        metric: record
        limit: 100000
        timeFrame: month
        overage_price: '0.40'
        overage_unit: 1000
        currency: USD
        quote: '100K records included then $0.40 per additional 1K records'
    limits:
      indices_per_application: 50
  - id: algolia-grow-plus
    name: Grow Plus
    type: pay-as-you-go
    price: null
    price_note: No base price published; billed on usage above the included allowances.
    currency: USD
    timeFrame: month
    contract_required: false
    badge: NEW
    description: >-
      Same included allowances as Grow, with a search-request overage rate 3.5x higher ($1.75 vs $0.50 per 1K).
      The pricing page does not state on this row which additional capabilities the higher rate buys.
    entries:
      - label: Search requests
        name: search_requests
        type: quota
        metric: search_request
        limit: 10000
        timeFrame: month
        overage_price: '1.75'
        overage_unit: 1000
        currency: USD
        quote: '10K search requests /month included then $1.75 per additional 1K'
      - label: Records
        name: records
        type: quota
        metric: record
        limit: 100000
        timeFrame: month
        overage_price: '0.40'
        overage_unit: 1000
        currency: USD
        quote: '100K records included then $0.40 per additional 1K records'
  - id: algolia-elevate
    name: Elevate
    type: enterprise
    price: null
    price_note: Contact sales - "Request pricing". Volume-based discounts available.
    currency: USD
    contract_required: true
    contract_term: annual
    description: 'Custom search requests and records; annual contract required.'
    entries:
      - label: Search requests
        name: search_requests
        type: custom
        metric: search_request
        limit: null
        quote: 'Custom search requests and records'
      - label: Records
        name: records
        type: custom
        metric: record
        limit: null
    limits:
      collections_per_index: 1000
add_ons:
  - name: Enterprise add-on
    url: https://dashboard.algolia.com/info/plans/
    includes: [SAML SSO, AES256 encryption via Algolia Vault, index restoration assistance, multi-cluster user-ID mapping]
    note: >-
      Referenced from the security and delete-indices documentation rather than priced on the pricing page.
free_products:
  - name: DocSearch
    url: https://docsearch.algolia.com/
    price: '0.00'
    note: >-
      Free hosted documentation search with its own limits - 25 GB application/index size, 20 indices, 3 queries
      per second, 10 team members. Separate from the plan ladder above.
mcp_pricing:
  note: 'Algolia states MCP usage counts toward the existing plan and carries no separate fee.'
  source: https://www.algolia.com/doc/guides/model-context-protocol
