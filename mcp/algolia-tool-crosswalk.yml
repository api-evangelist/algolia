mcp_only: []
rest_only:
  note: Both Algolia MCP servers are READ-ONLY by design - Algolia states they "search, recommend, and (for Productivity MCP)
    report analytics" and neither creates or modifies indices, records, or settings. Every write operation in the OpenAPI
    surface is therefore rest_only, as is the whole of Ingestion, Crawler, A/B Testing, Query Suggestions, Personalization,
    Composition, Agent Studio and Monitoring.
  docs: https://www.algolia.com/doc/guides/model-context-protocol
