aid: algolia
reviewed: '2026-05-30'
reviewer: API Evangelist
scope: Webhook / event-streaming surface assessment
summary: >-
  Algolia does not document a general-purpose public webhook or
  event-streaming surface. The Algolia platform is a synchronous
  hosted-search control plane exposed through fourteen documented
  REST APIs (Search, A/B Testing, Advanced Personalization, Agent
  Studio, Analytics, Classic Personalization, Composition, Crawler,
  Ingestion, Insights, Monitoring, Query Suggestions, Recommend, and
  Usage). The word "events" throughout Algolia's documentation refers
  to inbound click, conversion, view, and purchase signals that
  customers POST to the Insights API to feed Personalization,
  Recommend, A/B testing, and Analytics. No documented API endpoint
  lets a customer register a callback URL to receive outbound
  notifications from Algolia about indexing, crawling, ingestion
  task runs, personalization model updates, recommendation
  retraining, A/B test results, monitoring alerts, or any other
  platform-side event. The only Algolia-emitted, customer-consumable
  triggers documented anywhere are three Shopify Flow triggers
  ("Top searches", "Top searches with no results", and "Indexing
  paused") that are bound to the Shopify Flow integration channel
  and are not exposed as a generic HTTP webhook contract.
streaming:
  hasPublicStreamingSurface: false
  hasPublicWebhookSurface: false
  asyncApiModelable: false
  reason: >-
    AsyncAPI (and any honest webhook catalog) requires a
    provider-owned asynchronous transport - outbound HTTP webhooks,
    WebSocket, Server-Sent Events, Kafka, MQTT, AMQP, or similar -
    with a documented, customer-subscribable contract. Algolia's
    public documentation describes only synchronous request/response
    REST. The Crawler API, Ingestion API, and Monitoring API are all
    polled. The Insights API only accepts events; it does not emit
    them. The Shopify Flow triggers are emitted by the Algolia
    Shopify app into Shopify Flow's own event bus and are not
    available as a generic webhook target.
surfaces:
  - name: Algolia REST APIs (Search, Analytics, Recommend, etc.)
    transport: HTTPS REST
    baseURL: https://{appid}-dsn.algolia.net
    public: true
    asyncApiBindingAvailable: false
    notes: >-
      All fourteen documented REST APIs are synchronous JSON over
      HTTPS with application-ID + API-key authentication. They cover
      indexing, search, A/B testing, personalization, composition,
      crawler control, ingestion-task management, insights
      ingestion, monitoring status, query suggestions,
      recommendations, and usage. None expose a subscription or
      callback registration resource.
    references:
      - https://www.algolia.com/doc/rest-api/
      - https://www.algolia.com/doc/api-reference/
  - name: Insights API (event ingestion)
    transport: HTTPS REST (inbound)
    baseURL: https://insights.algolia.io
    public: true
    asyncApiBindingAvailable: false
    notes: >-
      The Insights API receives click, conversion, view, purchase,
      and add-to-cart events from customer applications. The flow is
      strictly customer-to-Algolia; Algolia does not publish these
      events back out. The word "events" in Algolia's docs almost
      always refers to this inbound surface.
    references:
      - https://www.algolia.com/doc/guides/sending-events/getting-started.md
      - https://www.algolia.com/doc/libraries/sdk/methods/insights.md
  - name: Ingestion API task runs
    transport: HTTPS REST (polled)
    public: true
    asyncApiBindingAvailable: false
    notes: >-
      The Ingestion API exposes "events" as a queryable log of task
      runs (list-events / get-event by ID). These are historical
      records retrieved on demand, not pushed. There is no documented
      way to subscribe to a stream of task-run events.
    references:
      - https://www.algolia.com/doc/libraries/sdk/methods/ingestion/list-events.md
      - https://www.algolia.com/doc/libraries/sdk/methods/ingestion/get-event.md
  - name: Crawler
    transport: HTTPS REST (polled)
    public: true
    asyncApiBindingAvailable: false
    notes: >-
      The Algolia Crawler documentation describes configuration,
      execution, and status retrieval through the Crawler REST API.
      No outbound webhook, email-alert, or push notification surface
      is documented for crawl-started, crawl-finished, crawl-failed,
      or URL-error events.
    references:
      - https://www.algolia.com/doc/tools/crawler/getting-started/overview/
      - https://www.algolia.com/doc/rest-api/crawler/
  - name: Connectors (Shopify, Salesforce B2C, Magento, BigCommerce, Segment, Tealium, GTM, BigQuery)
    transport: HTTPS REST (inbound to Algolia)
    public: true
    asyncApiBindingAvailable: false
    notes: >-
      Algolia connectors and platform integrations are described as
      pulling data from a source and pushing it to Algolia, or
      forwarding click/conversion events into the Insights API. They
      do not document outbound webhook delivery from Algolia.
    references:
      - https://www.algolia.com/doc/guides/sending-and-managing-data/send-and-update-your-data/connectors/
      - https://www.algolia.com/doc/guides/sending-events/connectors/segment.md
  - name: Shopify Flow triggers (Algolia Shopify app)
    transport: Shopify Flow event bus (not a generic webhook)
    public: true
    asyncApiBindingAvailable: false
    notes: >-
      The Algolia AI Search & Discovery Shopify app emits three
      triggers into Shopify Flow - "Top searches", "Top searches
      with no results", and "Indexing paused". These are the only
      Algolia-emitted, customer-consumable events documented in any
      Algolia property. They are bound to Shopify Flow's internal
      automation engine, are not addressable by a customer-supplied
      HTTPS callback URL, and are not exposed outside the Shopify
      integration. They are not a generic Algolia webhook product.
    references:
      - https://www.algolia.com/doc/integration/shopify/going-further/shopify-flow/
  - name: Monitoring / Status
    transport: HTTPS REST + public status page
    baseURL: https://status.algolia.com
    public: true
    asyncApiBindingAvailable: false
    notes: >-
      The Monitoring API is documented as a polled REST surface for
      infrastructure status. The public status page at
      status.algolia.com offers email/SMS/RSS subscriber alerts via
      Atlassian Statuspage, but those are end-user notifications
      from a third-party status tool, not a programmatic Algolia
      webhook contract.
    references:
      - https://www.algolia.com/doc/rest-api/monitoring/
      - https://status.algolia.com/
  - name: Personalization / Recommend model lifecycle
    transport: None (no event surface)
    public: false
    asyncApiBindingAvailable: false
    notes: >-
      Advanced Personalization and Recommend consume inbound events
      and expose configuration, training-status, and inference REST
      endpoints. No webhook is documented for "model retrained",
      "personalization profile updated", "recommendation strategy
      published", or similar lifecycle transitions.
    references:
      - https://www.algolia.com/doc/guides/personalization/advanced-personalization/configure/setup/enable-real-time-personalization.md
      - https://www.algolia.com/doc/guides/algolia-recommend/analytics/send-events.md
decisions:
  - action: Do not create an AsyncAPI specification for Algolia
    rationale: >-
      There is no documented Algolia-owned asynchronous transport to
      model. Producing an AsyncAPI document from the Insights inbound
      event taxonomy or the Shopify Flow triggers would
      misrepresent Algolia as offering a webhook/streaming product
      it has not published.
  - action: Do not create a webhooks catalog (no apis.yml update)
    rationale: >-
      No spec artifact was created, so apis.yml requires no
      modification. If a future apis.yml is added for the Algolia
      provider, a `webhooks` property should not be included until
      Algolia publishes a documented outbound event contract.
notes: >-
  Revisit if Algolia publishes any of the following as documented,
  customer-subscribable contracts: an HTTP webhook endpoint
  registration resource on the Crawler, Ingestion, Personalization,
  Recommend, A/B Testing, Monitoring, or Composition APIs; a
  Server-Sent Events feed for indexing task-run progress; a
  WebSocket for real-time personalization or recommendation
  updates; an event-bridge / EventBridge / PubSub partner
  integration; or a generalization of the Shopify Flow triggers
  ("Top searches", "Top searches with no results", "Indexing
  paused") into platform-wide webhook deliveries addressable by an
  arbitrary HTTPS URL.
sources:
  - https://www.algolia.com/doc/
  - https://www.algolia.com/llms.txt
  - https://www.algolia.com/doc/llms.txt
  - https://www.algolia.com/doc/rest-api/
  - https://www.algolia.com/doc/guides/sending-events/getting-started/
  - https://www.algolia.com/doc/guides/sending-and-managing-data/send-and-update-your-data/connectors/
  - https://www.algolia.com/doc/tools/crawler/getting-started/overview/
  - https://www.algolia.com/doc/integration/shopify/going-further/shopify-flow/
  - https://www.algolia.com/doc/rest-api/monitoring/
  - https://www.algolia.com/doc/rest-api/ingestion/
